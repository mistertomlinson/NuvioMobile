name: Rewatch VPS staging tests

on:
  push:
    branches:
      - prototype/rewatch-vps-staging-20261110
    paths:
      - 'services/rewatch-sync/**'
      - '.github/workflows/rewatch-sync-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Verify isolated replay sync service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated staging branch
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server and storage syntax
        working-directory: services/rewatch-sync
        run: |
          node --check server.mjs
          node --check store.mjs
          node --check server.test.mjs
          node --check scripts/enroll-staging-device.mjs
          node --check scripts/enroll-staging-device.test.mjs
          node --check scripts/smoke-installed-staging.mjs
      - name: Validate guarded staging provisioner syntax
        working-directory: services/rewatch-sync
        run: |
          bash -n scripts/provision-staging.sh
          bash -n scripts/update-staging.sh
          bash -n scripts/preview-caddy-placeholder.sh
      - name: Verify updater pin guard resolves paths from another directory
        run: |
          set -euo pipefail
          test ! -e /opt/nuvio-rewatch-staging/services/rewatch-sync/server.mjs
          ROOT="$(pwd)"
          SHA="$(git rev-parse HEAD)"
          LOG="$(mktemp)"
          if (cd /tmp && bash "$ROOT/services/rewatch-sync/scripts/update-staging.sh" "$SHA") >"$LOG" 2>&1; then
            cat "$LOG"
            echo "Updater unexpectedly succeeded on unprovisioned runner"
            exit 1
          fi
          cat "$LOG"
          grep -q "SOURCE_HEAD=${SHA:0:7}" "$LOG"
          grep -q 'ERROR=EXISTING_STAGING_SERVICE_MISSING' "$LOG"
      - name: Run replay staging regression tests
        working-directory: services/rewatch-sync
        run: npm test
      - name: End-to-end disposable multi-user smoke against staged modules
        working-directory: services/rewatch-sync
        env:
          REWATCH_SMOKE_ALLOW_TEST_DIR: '1'
        run: node scripts/smoke-installed-staging.mjs "$PWD"
