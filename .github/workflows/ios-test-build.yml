name: Build Test IPA

on:
  push:
    branches:
      - feature/persistent-simkl-rewatch-0.6.7
      - test/rewatch-public-https-20261112
      - fix/rewatch-manual-reposition-ipad-20261113
    paths:
      - 'composeApp/src/**'
      - 'composeApp/build.gradle.kts'
      - '.github/workflows/ios-test-build.yml'
  workflow_dispatch:
    inputs:
      configuration:
        description: Production-optimized or fast validation build
        required: true
        type: choice
        options:
          - Debug
          - Release
        default: Release

permissions:
  contents: read

concurrency:
  group: ios-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned full ${{ inputs.configuration || 'Release' }} IPA
    runs-on: xcode-27
    timeout-minutes: ${{ (github.ref == 'refs/heads/test/rewatch-public-https-20261112' || github.ref == 'refs/heads/fix/rewatch-manual-reposition-ipad-20261113') && 330 || (github.ref == 'refs/heads/feature/persistent-simkl-rewatch-0.6.7' && 75 || (inputs.configuration == 'Release' && 75 || 30)) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      # Keep Release optimizations and the established app identity on the iPad.
      # Source is pinned to the 180 passing tests; don't repeat expensive simulator linking.
      IOS_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Save a cache for repeated rewatch-branch validations instead of
          # using the default branch-only write policy.
          cache-read-only: ${{ github.ref != 'refs/heads/feature/persistent-simkl-rewatch-0.6.7' }}

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure runtime properties
        if: env.RELEASE_PROPERTIES_BASE64 != ''
        run: |
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties

      - name: Ensure optional local.properties input exists for simulator validation
        if: github.ref == 'refs/heads/feature/persistent-simkl-rewatch-0.6.7'
        shell: bash
        run: |
          # GenerateRuntimeConfigsTask marks this as an optional @InputFile,
          # but Gradle 9.4.1 validates the configured file path if absent.
          # Simulator-only compile tests need no production API credentials.
          if [[ ! -f local.properties ]]; then
            : > local.properties
          fi
          test -f local.properties

      - name: Use dedicated iPad Simkl V1 OAuth registration
        if: (github.ref == 'refs/heads/test/rewatch-public-https-20261112' || github.ref == 'refs/heads/fix/rewatch-manual-reposition-ipad-20261113')
        shell: bash
        env:
          NUVIO_SIMKL_IPAD_V1_CLIENT_ID: ${{ secrets.NUVIO_SIMKL_IPAD_V1_CLIENT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          client_id = os.environ.get("NUVIO_SIMKL_IPAD_V1_CLIENT_ID", "").strip()
          if not client_id or any(char in client_id for char in "\r\n="):
              raise SystemExit(
                  "::error::Missing or invalid NUVIO_SIMKL_IPAD_V1_CLIENT_ID Actions secret. "
                  "Do not build an IPA with the other Nuvio/TV Simkl registration."
              )

          path = Path("local.properties")
          if not path.is_file():
              raise SystemExit("::error::Missing base local.properties build configuration.")

          keep = [
              line
              for line in path.read_text().splitlines()
              if line.partition("=")[0].strip()
              not in ("SIMKL_CLIENT_ID", "SIMKL_REDIRECT_URI")
          ]
          keep.extend((
              "SIMKL_CLIENT_ID=" + client_id,
              "SIMKL_REDIRECT_URI=nuvio://auth/simkl",
          ))
          path.write_text("\n".join(keep) + "\n")
          print("Dedicated iPad Simkl V1 client and nuvio callback injected (client ID hidden).")
          PY

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Verify pinned iPad code already passed 180 simulator tests
        if: github.ref == 'refs/heads/fix/rewatch-manual-reposition-ipad-20261113'
        shell: bash
        run: |
          set -euo pipefail
          # Successful simulator validation: Actions run 43534230190.
          # This is build-only ONLY when the app code/dependencies still
          # exactly match that validated commit. Any change fails closed.
          test "$(git rev-parse HEAD:composeApp)" = "efde007e65e8f899a305db37cfb883af9579986c"
          test "$(git rev-parse HEAD:gradle)" = "763a465893baee515fabf0c275bf4c8b9a0ed146"
          test "$(git rev-parse HEAD:scripts)" = "ff852f3e4998246d9f1bb1274bd3d6d727759cd8"
          test "$(git rev-parse HEAD:build.gradle.kts)" = "d44c87655d18a09d04f1015c9a20a47a0c6ed8d2"
          test "$(git rev-parse HEAD:settings.gradle.kts)" = "884dc8e9415c2bc31f4f4e7128c0265c5202f582"
          # Assert app/widget identity consistency for any later Debug build;
          # this push packages the full optimized Release configuration.
          python3 - <<'PY'
          from pathlib import Path
          project = Path("iosApp/iosApp.xcodeproj/project.pbxproj").read_text()
          if project.count("PRODUCT_BUNDLE_IDENTIFIER = com.nuvio.media;") != 2:
              raise SystemExit("::error::Debug/Release application identity mismatch")
          if project.count("PRODUCT_BUNDLE_IDENTIFIER = com.nuvio.media.DownloadsWidgetExtension;") != 2:
              raise SystemExit("::error::Debug/Release widget identity mismatch")
          PY
          echo "REWATCH_IOS_TESTS=180_PASSED_IN_PRIOR_RUN_43534230190"
          echo "CURRENT_SOURCE_TREE=IDENTICAL_TO_TESTED_CODE"
          echo "BUILD_CONFIGURATION=$IOS_CONFIGURATION"

      - name: Validate rewatch-specific iOS simulator tests
        if: github.ref == 'refs/heads/feature/persistent-simkl-rewatch-0.6.7'
        run: |
          # Prior full-suite validation compiled successfully, but three
          # untouched legacy tests failed: ChapterSkipIntervalsTest (two)
          # and WatchProgressIdentityTest (one). Do not alter or silently
          # skip them in the full suite; this is a focused, separate gate.
          ./gradlew :composeApp:iosSimulatorArm64Test \
            --tests '*Rewatch*' \
            -Pnuvio.ios.distribution=full \
            -Dorg.gradle.jvmargs="-Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M" \
            -Pkotlin.native.jvmArgs="-Xmx4608M" \
            --console=plain

      - name: Summarize rewatch validation
        if: github.ref == 'refs/heads/feature/persistent-simkl-rewatch-0.6.7'
        run: |
          {
            echo "## Focused iPad rewatch validation"
            echo "Rewatch-specific iOS simulator tests passed."
            echo
            echo "Scope: --tests '*Rewatch*' (not the full 1,678-test suite)."
            echo "Full suite at 8b4a3b3fd3 compiled and executed 1,678 tests:"
            echo "1,675 passed, 3 unrelated tests failed."
            echo "HEAD=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record previously validated iPad test scope
        if: github.ref == 'refs/heads/fix/rewatch-manual-reposition-ipad-20261113'
        run: |
          {
            echo "## Previously validated rewatch tests"
            echo "The unchanged iPad source passed 180/180 iOS simulator rewatch tests."
            echo "Passed run: https://github.com/mistertomlinson/NuvioMobile/actions/runs/43534230190"
            echo "Current job skips recompiling simulator tests so Release packaging gets the full 330-minute window."
            echo "The optimized Release IPA retains the original app and widget bundle identifiers."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify isolated HTTPS test branch uses enabled replay gate
        if: (github.ref == 'refs/heads/test/rewatch-public-https-20261112' || github.ref == 'refs/heads/fix/rewatch-manual-reposition-ipad-20261113')
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const val ENABLED = true' composeApp/src/commonMain/kotlin/com/nuvio/app/features/rewatch/RewatchCommittedSaveHandoff.kt
          grep -q 'isolatedIpadDeviceTestEnablesReplayOnlySyncButDoesNotAutoInstallSink' composeApp/src/commonTest/kotlin/com/nuvio/app/features/rewatch/RewatchCommittedSaveHandoffTest.kt
          echo 'REWATCH_IPAD_SYNC=ENABLED_IN_ISOLATED_TEST_BRANCH'

      - name: Refuse incomplete full-release runtime configuration
        if: github.ref != 'refs/heads/feature/persistent-simkl-rewatch-0.6.7'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          properties = Path("local.properties")
          required = (
              "NUVIO_SUPABASE_URL",
              "NUVIO_SUPABASE_ANON_KEY",
              "TMDB_API_KEY",
              "SIMKL_CLIENT_ID",
              "SIMKL_REDIRECT_URI",
          )
          if not properties.is_file():
              raise SystemExit(
                  "::error::Missing local.properties. Configure the fork's "
                  "NUVIO_LOCAL_PROPERTIES_BASE64 Actions secret before building."
              )

          configured = {}
          for raw in properties.read_text().splitlines():
              line = raw.strip()
              if not line or line.startswith(("#", "!")) or "=" not in line:
                  continue
              name, value = line.split("=", 1)
              configured[name.strip()] = value.strip()
          missing = [name for name in required if not configured.get(name)]
          if missing:
              raise SystemExit(
                  "::error::Incomplete 0.6.7 full-release configuration: "
                  + ", ".join(missing)
                  + ". Do not distribute this IPA."
              )
          print("Required Nuvio, TMDB, and Simkl client/redirect build keys are present (values hidden).")
          PY

      - name: Build unsigned full ${{ inputs.configuration }} IPA
        if: github.ref != 'refs/heads/feature/persistent-simkl-rewatch-0.6.7'
        run: |
          (
            while sleep 60; do
              echo "::group::Build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime
              vm_stat
              ps -Ao pid,etime,%cpu,rss,command -r | head -n 12 || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT
          ./scripts/build-ios-ipa.sh

      - name: Summarize IPA
        if: github.ref != 'refs/heads/feature/persistent-simkl-rewatch-0.6.7'
        run: |
          configuration_slug="$(printf '%s' "${IOS_CONFIGURATION}" | tr '[:upper:]' '[:lower:]')"
          ipa_path="$(find build/ios-ipa -maxdepth 1 -type f -name "*-full-${configuration_slug}.ipa" -print -quit)"
          if [[ -z "${ipa_path}" ]]; then
            echo "No IPA was produced." >&2
            exit 1
          fi

          {
            echo "## Test IPA"
            echo
            echo "- File: $(basename "${ipa_path}")"
            echo "- Size: $(du -h "${ipa_path}" | cut -f1)"
            echo "- SHA-256: $(shasum -a 256 "${ipa_path}" | awk '{print $1}')"
            echo "- Distribution: full"
            echo "- Configuration: ${IOS_CONFIGURATION}"
            echo "- Signing: unsigned"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test IPA
        if: github.ref != 'refs/heads/feature/persistent-simkl-rewatch-0.6.7'
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-test-${{ inputs.configuration }}-ipa-${{ github.sha }}
          path: build/ios-ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

  android-rewatch-checkpoint:
    name: Validate Android TV replay checkpoint branch
    if: github.ref == 'refs/heads/feature/persistent-simkl-rewatch-0.6.7'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out pinned Android TV replay branch
        uses: actions/checkout@v4
        with:
          repository: mistertomlinson/NuvioTV
          ref: 88d2973ec91cf1fb5fb251fa8b316185b1d98a54
      - name: Verify expected Android source commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "88d2973ec91cf1fb5fb251fa8b316185b1d98a54"
          echo "ANDROID_SOURCE_HEAD=$(git rev-parse --short HEAD)"
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run Android TV replay planner and transport tests
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testSideloadUnitTest \
            --tests '*RewatchCommittedEventPlannerTest' \
            --tests '*RewatchRemoteCheckpointReaderTest' \
            --tests '*RewatchTransportCoordinatorTest' \
            --tests '*RewatchSyncOutboxTest' \
            --tests '*RewatchVpsApiTest' \
            --tests '*RewatchSilentSimklBootstrapTest' \
            --no-daemon --console=plain
      - name: Summarize Android regression validation
        run: |
          {
            echo '## Android TV replay planner and checkpoint tests'
            echo 'RESULT=ANDROID_REWATCH_CHECKPOINT_TESTS_PASSED'
            echo 'Source: mistertomlinson/NuvioTV'
            echo "HEAD=$(git rev-parse --short HEAD)"
            echo 'VPS=UNTOUCHED'
            echo 'INSTALLED_APPS=UNTOUCHED'
          } >> "$GITHUB_STEP_SUMMARY"
