name: Validate iPad Rewatch Branch

on:
  push:
    branches:
      - feature/persistent-simkl-rewatch-0.6.7
    paths:
      - 'composeApp/src/**'
      - 'composeApp/build.gradle.kts'
      - '.github/workflows/ios-rewatch-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-rewatch-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compile and test iOS rewatch changes
    runs-on: xcode-27
    timeout-minutes: 70
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      NUVIO_IOS_DISTRIBUTION: full
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
    steps:
      - name: Check out test branch
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: rewatch-konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            rewatch-konan-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify Apple tools
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Prepare full iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh
      - name: Compile and execute iOS simulator unit tests
        run: |
          ./gradlew :composeApp:iosSimulatorArm64Test \
            -Pnuvio.ios.distribution=full \
            -Dorg.gradle.jvmargs="-Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M" \
            -Pkotlin.native.jvmArgs="-Xmx4608M" \
            --console=plain --stacktrace
      - name: Record validation result
        if: success()
        run: |
          echo "REWATCH_IOS_COMMON_AND_SIMULATOR_TESTS_PASSED" >> "$GITHUB_STEP_SUMMARY"
          git rev-parse --short HEAD >> "$GITHUB_STEP_SUMMARY"
